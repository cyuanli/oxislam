[package]
name = "oxislam-features"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Feature extraction and matching algorithms"

[dependencies]
rayon = { version = "1.11", optional = true }
serde = { version = "1.0", optional = true, features = ["derive"] }
tracing = { version = "0.1", optional = true }
oxislam-geometry = { path = "../oxislam-geometry" }
oxislam-image = { path = "../oxislam-image" }
rand = "0.10.0"
rand_distr = "0.6.0"

[features]
default = []
rayon = ["dep:rayon", "oxislam-image/rayon"]
serde = ["dep:serde", "oxislam-geometry/serde"]
tracing = ["dep:tracing"]

[dev-dependencies]
image = "0.25"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-chrome = "0.7"
tracing-subscriber = "0.3"
oxislam-image = { path = "../oxislam-image", features = ["image"] }
oxislam-viz = { path = "../oxislam-viz" }
